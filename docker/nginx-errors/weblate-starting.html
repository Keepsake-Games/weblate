  Served by the image's nginx when the application cannot be reached (502),
  typically while it is starting. Replaces /etc/nginx/errors/weblate-starting.html
  from the official image, see the Dockerfile. Self-contained apart from the
  static font, which nginx serves without the application.
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="20">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#0f3e54">
    <link rel="stylesheet" href="/static/fonts/satoshi.css">
    <title>Jump Space Localization will be right back</title>
    <style>
      :root {
        --text: #2a3744;
        --muted: #5b6672;
        --bg: #ffffff;
        --band: #0f3e54;
        --band-text: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --text: #d9d3cc;
          --muted: #a9a49c;
          --bg: #1a1d1e;
          --band: #0f3e54;
          --band-text: #c7ebeb;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        font-family: Satoshi, "Source Sans 3", Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
        line-height: 1.5;
      }

      header {
        background: var(--band);
        color: var(--band-text);
        padding: 20px 16px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      main {
        flex: 1;
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
        padding: 72px 16px;
        text-align: center;
      }

      h1 {
        margin: 0 0 32px;
        font-size: 44px;
        font-weight: 500;
        line-height: 1.2;
      }

      p {
        margin: 0 0 20px;
        font-size: 19px;
      }

      p.small {
        margin-bottom: 6px;
        font-size: 16px;
        color: var(--muted);
      }

      @media (max-width: 550px) {
        main {
          padding: 40px 16px;
        }

        h1 {
          font-size: 32px;
        }

        p {
          font-size: 17px;
        }
      }
    </style>
  </head>
  <body>
    <header>Jump Space Localization</header>
    <main>
      <h1>We'll be right back</h1>
      <p>The localization portal is starting up or briefly unavailable.</p>
      <p>Translations you have already saved are not affected.</p>
      <p class="small">This page refreshes automatically every 20 seconds.</p>
      <p class="small">If it stays down for long, let us know on Discord.</p>
    </main>
  </body>
</html>
